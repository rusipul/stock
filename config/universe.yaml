# KRX가 data.krx.co.kr를 로그인 기반으로 전환해(2026-09 확인) 지수 구성종목을
# 자동으로 받을 수 없다. 그래서 목록을 여기에 직접 둔다. KRX_ID/KRX_PW가
# 생기면 sources/krx.py의 KrxUniverse로 갈아탈 수 있다.
#
# 종목을 더하려면 tickers에 6자리 코드 한 줄을 추가하면 된다.
# 종목명은 pykrx가 채우므로 적지 않아도 된다(주석은 사람이 읽기 위한 것).
#
# is_financial에 적은 종목은 하드필터에서 통째로 제외된다. 은행·보험·증권은
# 부채비율·유동비율이 구조적으로 달라 제조업과 같은 잣대로 재면 무의미하다.

